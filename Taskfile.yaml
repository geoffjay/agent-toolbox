version: "3"

tasks:
  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run linters and fix issues
    cmds:
      - golangci-lint run --fix ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  test:
    desc: Run tests
    cmds:
      - go test {{.CLI_ARGS}} ./...

  modernize:
    desc: Modernize code
    cmds:
      - go fix ./...

  install:
    desc: Install gag locally
    cmds:
      - go install -v .

  run:
    desc: Run gag
    aliases: [default]
    cmds:
      - go run .
